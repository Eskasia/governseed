name: Source Freshness

# The capability matrices pin official-documentation sentences as of a fixed
# date. This job re-fetches each pinned page weekly and fails on DRIFTED, so a
# sentence disappearing upstream surfaces as a red run instead of silent rot.
# UNREACHABLE does not fail: a network blip is not evidence of drift.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify:sources -- --strict
