name: Governance impact real evaluator

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Repository-relative synthetic scenario directory
        required: true
        type: string
      manifest:
        description: Repository-relative preregistered manifest
        required: true
        type: string
      policy:
        description: Repository-relative gate policy
        required: true
        type: string
      preflight_receipt:
        description: Committed credential-free OCI preflight receipt
        required: true
        type: string
      attempt_id:
        description: Preregistered 64-character lowercase attempt ID
        required: true
        type: string
      output:
        description: Repository-relative paired-run output JSON
        required: true
        type: string
      runtime_image:
        description: Reviewed OCI image reference pinned with @sha256 digest
        required: true
        type: string
      codex_version:
        description: Exact reviewed single-line Codex version
        required: true
        type: string
      codex_binary_sha256:
        description: Reviewed lowercase SHA-256 of the Codex executable
        required: true
        type: string
      timeout_ms:
        description: Exact per-arm deadline in milliseconds, maximum 600000
        required: true
        type: string

concurrency:
  group: governance-impact-real
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-evaluator:
    runs-on: ubuntu-latest
    environment: governance-impact-real
    timeout-minutes: 30
    steps:
      - name: Check out committed inputs
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate reviewed image provenance
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          CODEX_BINARY_SHA256: ${{ inputs.codex_binary_sha256 }}
          OUTPUT_PATH: ${{ inputs.output }}
          PREFLIGHT_RECEIPT: ${{ inputs.preflight_receipt }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: |
          if [[ ! "$RUNTIME_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "runtime_image must be a digest-pinned OCI reference." >&2
            exit 2
          fi
          if [[ ! "$CODEX_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "codex_binary_sha256 must be a lowercase SHA-256." >&2
            exit 2
          fi
          if [[ ! "$OUTPUT_PATH" =~ ^artifacts/governance-impact/[A-Za-z0-9][A-Za-z0-9._-]*\.json$ ]]; then
            echo "output must be one JSON file in artifacts/governance-impact/." >&2
            exit 2
          fi
          if [[ ! "$PREFLIGHT_RECEIPT" =~ ^artifacts/governance-impact/preflight-[A-Za-z0-9][A-Za-z0-9._-]*\.json$ ]]; then
            echo "preflight_receipt must be one committed receipt in artifacts/governance-impact/." >&2
            exit 2
          fi
          if [[ ! "$TIMEOUT_MS" =~ ^[1-9][0-9]*$ ]] || (( ${#TIMEOUT_MS} > 6 )) || (( 10#$TIMEOUT_MS > 600000 )); then
            echo "timeout_ms must be an integer from 1 through 600000." >&2
            exit 2
          fi

      - name: Pull reviewed digest image
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: docker pull "$RUNTIME_IMAGE"

      - name: Run real evaluator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOVERNANCE_IMPACT_REAL: '1'
          SCENARIO: ${{ inputs.scenario }}
          MANIFEST: ${{ inputs.manifest }}
          POLICY: ${{ inputs.policy }}
          PREFLIGHT_RECEIPT: ${{ inputs.preflight_receipt }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          OUTPUT_PATH: ${{ inputs.output }}
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          CODEX_BINARY_SHA256: ${{ inputs.codex_binary_sha256 }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
          TMPDIR: ${{ runner.temp }}
        run: |
          node scripts/governance-impact-eval.mjs run \
            --scenario "$SCENARIO" \
            --manifest "$MANIFEST" \
            --policy "$POLICY" \
            --preflight-receipt "$PREFLIGHT_RECEIPT" \
            --attempt-id "$ATTEMPT_ID" \
            --output "$OUTPUT_PATH" \
            --runtime-image "$RUNTIME_IMAGE" \
            --codex-version "$CODEX_VERSION" \
            --codex-binary-sha256 "$CODEX_BINARY_SHA256" \
            --timeout-ms "$TIMEOUT_MS"

      - name: Upload paired-run evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: governance-impact-real-evidence
          path: ${{ inputs.output }}
          if-no-files-found: error

      - name: Remove output and temporary evidence
        if: ${{ always() }}
        env:
          OUTPUT_PATH: ${{ inputs.output }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';

          const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
          const isContained = (candidate) => (
            candidate !== workspace
            && candidate.startsWith(`${workspace}${path.sep}`)
          );
          const removeContained = (candidate) => {
            if (typeof candidate !== 'string' || candidate.length === 0) return;
            const resolved = path.resolve(workspace, candidate);
            if (!isContained(resolved)) return;
            let existingParent = path.dirname(resolved);
            while (!fs.existsSync(existingParent) && isContained(existingParent)) {
              existingParent = path.dirname(existingParent);
            }
            const realParent = fs.realpathSync(existingParent);
            if (realParent === workspace || isContained(realParent)) {
              fs.rmSync(resolved, { recursive: true, force: true });
            }
          };

          removeContained(process.env.OUTPUT_PATH);
          removeContained('.tmp/governance-impact');

          const runnerTemp = fs.realpathSync(process.env.RUNNER_TEMP);
          for (const entry of fs.readdirSync(runnerTemp)) {
            if (entry.startsWith('governance-impact-')) {
              fs.rmSync(path.join(runnerTemp, entry), {
                recursive: true,
                force: true,
              });
            }
          }

          const listed = spawnSync('docker', [
            'ps',
            '--all',
            '--quiet',
            '--filter',
            'label=org.openai.governance-impact.managed',
          ], {
            encoding: 'utf8',
            shell: false,
            stdio: ['ignore', 'pipe', 'ignore'],
          });
          if (listed.status === 0) {
            const ids = listed.stdout
              .split(/\r?\n/u)
              .map((value) => value.trim())
              .filter((value) => /^[a-f0-9]{12,64}$/u.test(value));
            for (const id of ids) {
              spawnSync('docker', ['rm', '--force', '--volumes', id], {
                shell: false,
                stdio: 'ignore',
              });
            }
          }
          NODE
