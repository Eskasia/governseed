name: External OSS V8 Runtime Identity

on:
  workflow_dispatch:
    inputs:
      runtime_image:
        description: Exact reviewed OCI image reference containing /usr/local/bin/node
        required: true
        type: string
      authorized_main_commit:
        description: Exact main commit authorized for this one-time runtime identity run
        required: true
        type: string

permissions:
  contents: read

env:
  BENCHMARK_ID: GS-OSS-2026-08-02-V8
  MODEL_ID: gpt-5.6-luna
  PROVIDER_ENDPOINT: https://api.openai.com/v1/responses
  REQUEST_LIMIT: '1'
  TIMEOUT_MS: '30000'

jobs:
  runtime-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: governseed-v8-runtime
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up fixed host Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize redacted failure evidence
        shell: bash
        run: |
          set -euo pipefail
          run_root="$RUNNER_TEMP/external-oss-v8-runtime-identity/$GITHUB_RUN_ID"
          mkdir -p "$run_root"
          chmod 0700 "$run_root"
          printf '%s\n' "RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          printf '%s\n' 'FAILURE_STAGE=binding-validation' 'FAILURE_CODE=BINDING_VALIDATION_PENDING' >> "$GITHUB_ENV"

      - name: Validate one-time main runtime authorization
        if: ${{ success() }}
        shell: bash
        env:
          AUTHORIZED_MAIN_COMMIT: ${{ inputs.authorized_main_commit }}
          AUTHORIZED_REF: ${{ github.ref }}
          AUTHORIZED_SHA: ${{ github.sha }}
          AUTHORIZED_RUN_ATTEMPT: ${{ github.run_attempt }}
          AUTHORIZATION_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RUN_ROOT="$RUN_ROOT" AUTHORIZED_MAIN_COMMIT="$AUTHORIZED_MAIN_COMMIT" AUTHORIZED_REF="$AUTHORIZED_REF" AUTHORIZED_SHA="$AUTHORIZED_SHA" AUTHORIZED_RUN_ATTEMPT="$AUTHORIZED_RUN_ATTEMPT" AUTHORIZATION_RUN_ID="$AUTHORIZATION_RUN_ID" node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          const runRoot = process.env.RUN_ROOT;
          const historicalRunIds = new Set(['30814159615', '30824406710', '30850478318']);
          const setFailure = (failureCode) => {
            appendFileSync(process.env.GITHUB_ENV, `FAILURE_STAGE=authorization-gate\nFAILURE_CODE=${failureCode}\n`);
            writeFileSync(path.join(runRoot, 'authorization-diagnostic.json'), JSON.stringify({
              failureStage: 'authorization-gate',
              failureCode,
              workflowRunId: process.env.AUTHORIZATION_RUN_ID,
              authorizedMainCommit: process.env.AUTHORIZED_MAIN_COMMIT,
              githubSha: process.env.AUTHORIZED_SHA,
              githubRef: process.env.AUTHORIZED_REF,
              runAttempt: Number(process.env.AUTHORIZED_RUN_ATTEMPT),
              environment: 'governseed-v8-runtime',
            }, null, 2) + '\n', { mode: 0o600 });
            process.exit(1);
          };
          if (process.env.AUTHORIZED_REF !== 'refs/heads/main') setFailure('MAIN_BRANCH_REQUIRED');
          if (historicalRunIds.has(process.env.AUTHORIZATION_RUN_ID)) setFailure('HISTORICAL_RERUN_FORBIDDEN');
          if (process.env.AUTHORIZED_RUN_ATTEMPT !== '1') setFailure('RERUN_FORBIDDEN');
          if (!/^[0-9a-f]{40}$/u.test(process.env.AUTHORIZED_MAIN_COMMIT)
            || process.env.AUTHORIZED_SHA !== process.env.AUTHORIZED_MAIN_COMMIT) {
            setFailure('AUTHORIZED_MAIN_COMMIT_MISMATCH');
          }
          writeFileSync(path.join(runRoot, 'authorization-identity.json'), JSON.stringify({
            schemaVersion: 1,
            authorizationIdentity: `github-run-${process.env.AUTHORIZATION_RUN_ID}`,
            workflowRunId: process.env.AUTHORIZATION_RUN_ID,
            authorizedMainCommit: process.env.AUTHORIZED_MAIN_COMMIT,
            githubSha: process.env.AUTHORIZED_SHA,
            githubRef: process.env.AUTHORIZED_REF,
            runAttempt: Number(process.env.AUTHORIZED_RUN_ATTEMPT),
            environment: 'governseed-v8-runtime',
            providerRequests: 0,
            workflowDispatch: 'RUN',
            runtimeCanary: 'NOT_RUN',
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Validate diagnostic repair authorization and technical bindings
        if: ${{ success() }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=binding-validation' 'FAILURE_CODE=BINDING_VALIDATION_PENDING' >> "$GITHUB_ENV"
          RUNTIME_IMAGE="$RUNTIME_IMAGE" RUN_ROOT="$RUN_ROOT" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';

          const root = process.cwd();
          const runRoot = process.env.RUN_ROOT;
          const readJson = (relativePath) => JSON.parse(readFileSync(path.join(root, relativePath), 'utf8'));
          const sha256 = (relativePath) => createHash('sha256')
            .update(readFileSync(path.join(root, relativePath)))
            .digest('hex');
          const fail = (failureCode, failedChecks) => {
            appendFileSync(process.env.GITHUB_ENV, `FAILURE_STAGE=binding-validation\nFAILURE_CODE=${failureCode}\n`);
            writeFileSync(path.join(runRoot, 'validation-diagnostic.json'), JSON.stringify({
              failureStage: 'binding-validation',
              failureCode,
              failedChecks,
              runtimeImageDigestMatch: false,
            }, null, 2) + '\n', { mode: 0o600 });
            process.exit(1);
          };
          const expectedRuntimeImage = 'node@sha256:3cb89926a7a025953446306a17c3e044768c35a1245a57ec38a61ef4c59373a5';
          const attemptRoot = 'benchmarks/external-oss-v8/credential-transport/repair-2/attempt-7';
          const manifestPath = `${attemptRoot}/technical-manifest.json`;
          const packetPath = `${attemptRoot}/review-packet.json`;
          const authorizationPath = `${attemptRoot}/authorization-source.json`;
          const failurePath = `${attemptRoot}/failed-run-source.json`;
          const workflowPath = '.github/workflows/external-oss-v8-runtime-identity.yml';
          const manifest = readJson(manifestPath);
          const packet = readJson(packetPath);
          const authorization = readJson(authorizationPath);
          const failedRun = readJson(failurePath);
          if (process.env.RUNTIME_IMAGE !== expectedRuntimeImage) {
            fail('RUNTIME_IMAGE_IDENTITY_MISMATCH', ['runtimeImageMatches']);
          }
          if (
            manifest.schemaVersion !== 1
            || manifest.benchmarkId !== 'GS-OSS-2026-08-02-V8'
            || manifest.gate !== 'G2'
            || manifest.repair !== 'non-2xx-diagnostic-repair'
            || manifest.attempt !== 7
            || !Array.isArray(manifest.entries)
            || manifest.entries.length === 0
            || manifest.entries.some((entry) => (
              typeof entry?.path !== 'string'
              || !/^[0-9a-f]{64}$/u.test(entry?.sha256)
              || sha256(entry.path) !== entry.sha256
            ))
          ) fail('DIAGNOSTIC_TECHNICAL_MANIFEST_MISMATCH', ['technicalManifestMatches']);
          if (
            authorization.commentId !== 5193631262
            || authorization.commentUrl !== 'https://github.com/Eskasia/governseed/issues/92#issuecomment-5193631262'
            || authorization.commentAuthor !== 'Eskasia'
            || authorization.commentCreatedAt !== '2026-08-05T15:15:50Z'
            || authorization.commentUpdatedAt !== '2026-08-05T15:15:50Z'
            || authorization.commentBodySha256 !== '0cacc6164223196ea46f13b2101bae8622c9b172bf90feeb2de60d6e35bfca0a'
            || authorization.providerRequestAuthorized !== false
            || authorization.workflowDispatchAuthorized !== false
          ) fail('DIAGNOSTIC_REPAIR_AUTHORIZATION_SOURCE_MISMATCH', ['authorizationSourceMatches']);
          if (
            failedRun.workflowId !== 325585082
            || failedRun.runId !== 31014045209
            || failedRun.runAttempt !== 1
            || failedRun.headSha !== '4e1347e510a0068efbdff6942748671490c798ea'
            || failedRun.failureReceiptCommentId !== 5193562726
            || failedRun.failureReceiptBodySha256 !== '4a1d95b883a90bc98faadae41c4cf4bea656d5e3cf390fb3cc5625485f08e361'
            || failedRun.artifactId !== 8935651599
            || failedRun.artifactDigest !== 'sha256:567ca3d9e79d72da8c69508b686f85ea0baabdf61d860495001478f5f12777be'
            || failedRun.failureArtifactSha256 !== '1cc4353eef786e8541d55a8d2b9a39770518037b132a60e68c0aaa50141c99fd'
            || failedRun.providerRequestAttempt !== 'INDETERMINATE'
            || failedRun.possiblyConsumedRequestCount !== 1
            || failedRun.rerunPermitted !== false
          ) fail('FAILED_RUN_PROVENANCE_MISMATCH', ['failedRunSourceMatches']);
          if (
            packet.schemaVersion !== 1
            || packet.status !== 'PENDING_OWNER_REVIEW'
            || packet.benchmarkId !== 'GS-OSS-2026-08-02-V8'
            || packet.modelBinding?.provider !== 'OpenAI'
            || packet.modelBinding?.modelId !== 'gpt-5.6-luna'
            || packet.modelBinding?.aliasAllowed !== false
            || packet.modelBinding?.fallbackAllowed !== false
            || packet.transport?.endpoint !== 'https://api.openai.com/v1/responses'
            || packet.transport?.requestLimit !== 1
            || packet.transport?.timeoutMs !== 30000
            || packet.transport?.retryAllowed !== false
            || packet.transport?.tokenCeiling !== 8192
            || packet.runtime?.image !== expectedRuntimeImage
            || packet.hashes?.workflowSha256 !== sha256(workflowPath)
            || packet.hashes?.technicalManifestSha256 !== sha256(manifestPath)
            || packet.hashes?.authorizationSourceSha256 !== sha256(authorizationPath)
            || packet.hashes?.failedRunSourceSha256 !== sha256(failurePath)
          ) fail('DIAGNOSTIC_REVIEW_PACKET_MISMATCH', ['reviewPacketMatches']);
          writeFileSync(path.join(runRoot, 'validation-diagnostic.json'), JSON.stringify({
            failureStage: 'binding-validation',
            failureCode: 'BINDING_VALIDATION_PASS',
            runtimeImageDigestMatch: true,
            providerRequestAttempt: 'NO',
            workflowDispatch: 'NOT_RUN',
            runtimeCanary: 'NOT_RUN',
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Historical repair-6 validator retained but non-executable
        if: ${{ false }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=binding-validation' 'FAILURE_CODE=BINDING_VALIDATION_PENDING' >> "$GITHUB_ENV"
          RUNTIME_IMAGE="$RUNTIME_IMAGE" RUN_ROOT="$RUN_ROOT" GITHUB_RUN_ID="$GITHUB_RUN_ID" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';

          const root = process.cwd();
          const runRoot = process.env.RUN_ROOT;
          const readJson = (relativePath) => JSON.parse(readFileSync(path.join(root, relativePath), 'utf8'));
          const sha256 = (relativePath) => createHash('sha256')
            .update(readFileSync(path.join(root, relativePath)))
            .digest('hex');
          const setFailure = (failureCode, failedChecks) => {
            appendFileSync(process.env.GITHUB_ENV, `FAILURE_STAGE=binding-validation\nFAILURE_CODE=${failureCode}\n`);
            writeFileSync(path.join(runRoot, 'validation-diagnostic.json'), JSON.stringify({
              failureStage: 'binding-validation',
              failureCode,
              failedChecks,
              runtimeImageDigestMatch: false,
            }, null, 2) + '\n', { mode: 0o600 });
            process.exit(1);
          };
          const requiredModel = {
            provider: 'OpenAI',
            modelId: 'gpt-5.6-luna',
            aliasAllowed: false,
            fallbackAllowed: false,
          };
          const requiredScope = ['credential-transport', 'runtime-identity-canary', 'v8-pilot'];
          const expectedRuntimeImage = 'node@sha256:3cb89926a7a025953446306a17c3e044768c35a1245a57ec38a61ef4c59373a5';
          const expectedFixedInput = 'Return exactly the JSON object {"runtime_canary":"PASS"}.';
          const expectedDesignSha256 = '434da5f42ae9d5752b5db6641557cec6a3893a22988225947458d287d516d995';
          const expectedRequestSchemaSha256 = '630ee0eb7b1ca458b1562a676f318430b675b92b005a98c958cb3226b65afb51';
          const expectedResponseSchemaSha256 = '5900d37c01493a0e7ca1712936a52fbf2514296c1edb0fcce7182c5662c2a08e';
          const expectedProviderResponseContractSha256 = '5b36f410ebc898a34eb2d4e67814441c78d5331e1d0764750aeb98c9bfb7f528';
          const expectedNormalizedResponseSchemaSha256 = '5900d37c01493a0e7ca1712936a52fbf2514296c1edb0fcce7182c5662c2a08e';
          const expectedProxySha256 = 'f9dd7b6a0778e69f123d060a8df8cef1ab97e63756e7f819cf70d8d6ed85790c';
          const expectedCommentBodySha256 = '41a47521099af120135d4ddb65aa10cf6f4180b3271ed904cf95d277ecc58840';
          const expectedTechnicalHead = 'b7e7d34e68031671dee41fe7fe13800accae3e51';
          const expectedTechnicalTree = '2492683260127bc118f090a8f1808da367264dbc';
          const expectedFailedRunId = '30850478318';
          const attempt5ImmutableHashes = {
            approvalSha256: 'f6fd0c2cb59f58ca5e49e570535ab50c810c0c77f56e1164945a3dad0562c75b',
            sourceSha256: '35ea7be4664c021bf72d20264290359f426aac4c554455113a8a5ba504a60d1d',
            templateSha256: '94fb9c5696d89aebf5cf849758f21201db06d2522191817e5ef4c0aa5cfb5af8',
            addendumSha256: 'e8935018f446c468425c008cedb3ceba3002caadd566ed4f620522fe64295265',
            packetSha256: '0a215526da26ff3ec59df9ad5c696c70c33a9229ff092617aabe8e3b2577839d',
            manifestSha256: 'e71090b084ff17a964027d1a7288b43d526152852131ac866d64bd836705c809',
          };
          const workflowPath = '.github/workflows/external-oss-v8-runtime-identity.yml';
          const designPath = 'benchmarks/external-oss-v8/credential-transport/repair-2/design.json';
          const proxyPath = 'experimental/governance-impact/lib/credential-proxy.mjs';
          const clientPath = 'benchmarks/external-oss-v8/control/G2/runtime-canary-prep/canary-client.mjs';
          const proxyRunnerPath = 'benchmarks/external-oss-v8/control/G2/runtime-canary-prep/host-proxy.mjs';
          const manifestPath = 'benchmarks/external-oss-v8/credential-transport/repair-2/attempt-6/technical-manifest.json';
          const packetPath = 'benchmarks/external-oss-v8/credential-transport/repair-2/attempt-6/review-packet.json';
          const pendingPath = 'benchmarks/external-oss-v8/credential-transport/human-approval-repair-2-attempt-6.template.json';
          const addendumPath = 'benchmarks/external-oss-v8/credential-transport/human-approval-repair-2-attempt-6.addendum.json';
          const approvedPath = 'benchmarks/external-oss-v8/credential-transport/human-approval-repair-2-attempt-5.json';
          const sourcePath = 'benchmarks/external-oss-v8/credential-transport/human-approval-repair-2-attempt-5-source.json';
          const attempt5ManifestPath = 'benchmarks/external-oss-v8/credential-transport/repair-2/attempt-5/technical-manifest.json';
          const attempt5PacketPath = 'benchmarks/external-oss-v8/credential-transport/repair-2/attempt-5/review-packet.json';
          const attempt5PendingPath = 'benchmarks/external-oss-v8/credential-transport/human-approval-repair-2-attempt-5.template.json';
          const attempt5AddendumPath = 'benchmarks/external-oss-v8/credential-transport/human-approval-repair-2-attempt-5.addendum.json';
          const manifest = readJson(manifestPath);
          const packet = readJson(packetPath);
          const pending = readJson(pendingPath);
          const addendum = readJson(addendumPath);
          let approval;
          let source;
          let attempt5Manifest;
          let attempt5Packet;
          let attempt5Pending;
          let attempt5Addendum;
          try {
            approval = readJson(approvedPath);
          } catch {
            setFailure('ATTEMPT5_APPROVAL_INVALID', ['attempt5ApprovalMatches']);
          }
          try {
            source = readJson(sourcePath);
            attempt5Manifest = readJson(attempt5ManifestPath);
            attempt5Packet = readJson(attempt5PacketPath);
            attempt5Pending = readJson(attempt5PendingPath);
            attempt5Addendum = readJson(attempt5AddendumPath);
          } catch {
            setFailure('ATTEMPT5_APPROVAL_SOURCE_INVALID', ['attempt5ApprovalSourceMatches']);
          }
          const technicalPaths = [
            workflowPath,
            clientPath,
            proxyRunnerPath,
            designPath,
            'benchmarks/external-oss-v8/credential-transport/repair-2/normalized-proxy-response.schema.json',
            'benchmarks/external-oss-v8/credential-transport/repair-2/provider-response-validation.json',
            'benchmarks/external-oss-v8/credential-transport/repair-2/request.schema.json',
            'benchmarks/external-oss-v8/credential-transport/repair-2/response.schema.json',
            proxyPath,
            'experimental/governance-impact/lib/oci-proxy-facade.mjs',
            'experimental/governance-impact/lib/oci-supervisor.mjs',
            'experimental/governance-impact/lib/provider-response-validation.mjs',
            'experimental/governance-impact/uds-relay.mjs',
          ];
          const expectedEntries = technicalPaths.map((filePath) => ({ path: filePath, sha256: sha256(filePath) }));
          if (process.env.RUNTIME_IMAGE !== expectedRuntimeImage) {
            setFailure('RUNTIME_IMAGE_IDENTITY_MISMATCH', ['runtimeImageMatches']);
          }
          if (
            manifest.schemaVersion !== 1
            || manifest.benchmarkId !== process.env.BENCHMARK_ID
            || manifest.gate !== 'G2'
            || manifest.repair !== 'repair-2'
            || manifest.attempt !== 6
            || !Array.isArray(manifest.entries)
            || manifest.entries.length !== expectedEntries.length
          ) setFailure('TECHNICAL_BINDING_INVALID', ['runtimeImageMatches', 'technicalManifestMatches']);
          if (manifest.entries.some((entry, index) => entry?.path !== expectedEntries[index].path || entry?.sha256 !== expectedEntries[index].sha256)) setFailure('TECHNICAL_MANIFEST_HASH_MISMATCH', ['technicalManifestMatches']);
          if (
            packet.schemaVersion !== 1
            || packet.benchmarkId !== process.env.BENCHMARK_ID
            || packet.gate !== 'G2'
            || packet.repair !== 'repair-2'
            || packet.attempt !== 6
            || packet.status !== 'PENDING_HUMAN_REPAIR_6_REVIEW'
            || JSON.stringify(packet.modelBinding) !== JSON.stringify(requiredModel)
            || packet.transport?.requestLimit !== 1
            || packet.transport?.timeoutMs !== 30000
            || packet.transport?.retryAllowed !== false
            || packet.transport?.responseModelId !== 'gpt-5.6-luna'
            || packet.transport?.structuredOutputPath !== 'text.format'
            || packet.transport?.forbiddenRequestField !== 'response_format'
            || packet.transport?.fixedInput !== expectedFixedInput
            || packet.runtime?.image !== expectedRuntimeImage
            || packet.runtime?.nodeExecutable !== '/usr/local/bin/node'
            || packet.runtime?.nodeVersion !== 'v26.3.0'
            || packet.runtime?.requestLimit !== 1
            || packet.runtime?.timeoutMs !== 30000
            || packet.runtime?.fixedCanaryInput !== expectedFixedInput
            || packet.runtime?.containerCredentialValues !== false
            || packet.authorizationGate?.environment !== 'governseed-v8-runtime'
            || packet.authorizationGate?.workflowDispatchOnly !== true
            || packet.authorizationGate?.mainRef !== 'refs/heads/main'
            || packet.authorizationGate?.authorizedMainCommitInput !== 'authorized_main_commit'
            || packet.authorizationGate?.runAttemptMustEqual !== 1
            || packet.authorizationGate?.runIdentityField !== 'github.run_id'
            || packet.authorizationGate?.rerunFailureCode !== 'RERUN_FORBIDDEN'
            || packet.authorizationGate?.commitMismatchFailureCode !== 'AUTHORIZED_MAIN_COMMIT_MISMATCH'
            || packet.authorizationGate?.requiredReviewer !== 'Eskasia'
            || packet.authorizationGate?.adminBypassAllowed !== false
            || packet.authorizationGate?.deploymentBranch !== 'main'
            || packet.humanTechnicalReview?.status !== 'PENDING_HUMAN_REVIEW'
          ) setFailure('REVIEW_PACKET_BINDING_INVALID', ['modelBindingMatches', 'requestTransportMatches']);
          const packetHashChecks = [
            ['designSha256', designPath],
            ['proxySourceSha256', proxyPath],
            ['canaryClientSha256', clientPath],
            ['hostProxySha256', proxyRunnerPath],
            ['workflowSha256', workflowPath],
            ['technicalManifestSha256', manifestPath],
          ];
          if (packetHashChecks.some(([field, filePath]) => packet.hashes?.[field] !== sha256(filePath))) setFailure('REVIEW_PACKET_HASH_MISMATCH', ['reviewPacketHashMatches']);
          const attempt5WorkflowEntry = attempt5Manifest.entries?.find((entry) => entry?.path === workflowPath);
          const approvalValid = approval.schemaVersion === 1
            && approval.benchmarkId === process.env.BENCHMARK_ID
            && approval.approvalStatus === 'APPROVED'
            && approval.approvedBy === 'Eskasia'
            && approval.approvedAt === '2026-08-04T08:15:01Z'
            && approval.approvedDesignSha256 === expectedDesignSha256
            && approval.approvedProxySha256 === expectedProxySha256
            && approval.approvedModelId === requiredModel.modelId
            && JSON.stringify(approval.scope) === JSON.stringify(requiredScope)
            && approval.limitationsAcknowledged === true
            && approval.approvalEvidence?.type === 'github-comment'
            && approval.approvalEvidence?.reference === 'https://github.com/Eskasia/governseed/pull/80#issuecomment-5176356972'
            && approval.approvalEvidence?.commentId === 5176356972
            && approval.approvalEvidence?.commentAuthor === 'Eskasia'
            && approval.approvalEvidence?.commentCreatedAt === '2026-08-04T08:15:01Z'
            && sha256(proxyPath) === expectedProxySha256;
          if (!approvalValid) setFailure('ATTEMPT5_APPROVAL_INVALID', ['attempt5ApprovalMatches']);
          const sourceValid = source.schemaVersion === 1
            && source.benchmarkId === process.env.BENCHMARK_ID
            && source.gate === 'G2'
            && source.repair === 'runtime-canary-repair-5'
            && source.attempt === 5
            && source.approvalStatus === 'APPROVED'
            && source.verificationStatus === 'VERIFIED_GITHUB_ISSUE_COMMENT'
            && source.repository === 'Eskasia/governseed'
            && source.pullRequest === 80
            && source.commentId === 5176356972
            && source.commentUrl === 'https://github.com/Eskasia/governseed/pull/80#issuecomment-5176356972'
            && source.commentAuthor === 'Eskasia'
            && source.commentCreatedAt === '2026-08-04T08:15:01Z'
            && source.commentUpdatedAt === '2026-08-04T08:15:01Z'
            && source.approvedAtDeclared === '2026-08-04T08:09:00Z'
            && source.approvalEffectiveAt === '2026-08-04T08:15:01Z'
            && source.commentBodySha256 === expectedCommentBodySha256
            && source.reviewedTechnicalHead === expectedTechnicalHead
            && source.reviewedTechnicalTreeSha === expectedTechnicalTree
            && source.workflowSha256 === attempt5WorkflowEntry?.sha256
            && source.canaryClientSha256 === sha256(clientPath)
            && source.hostProxySha256 === sha256(proxyRunnerPath)
            && source.technicalManifestEntries === 13
            && source.credentialProxySha256 === expectedProxySha256
            && source.reviewPacketSha256 === sha256(attempt5PacketPath)
            && source.technicalManifestSha256 === sha256(attempt5ManifestPath)
            && source.bodyClaims?.approvedModelId === requiredModel.modelId
            && source.bodyClaims?.aliasAllowed === false
            && source.bodyClaims?.fallbackAllowed === false
            && source.bodyClaims?.designSha256 === expectedDesignSha256
            && source.bodyClaims?.requestSchemaSha256 === expectedRequestSchemaSha256
            && source.bodyClaims?.responseSchemaSha256 === expectedResponseSchemaSha256
            && source.bodyClaims?.providerResponseContractSha256 === expectedProviderResponseContractSha256
            && source.bodyClaims?.normalizedResponseSchemaSha256 === expectedNormalizedResponseSchemaSha256
            && source.bodyClaims?.runtimeImage === expectedRuntimeImage
            && source.bodyClaims?.nodeExecutable === '/usr/local/bin/node'
            && source.bodyClaims?.nodeVersion === 'v26.3.0'
            && source.bodyClaims?.requestLimit === 1
            && source.bodyClaims?.timeoutMs === 30000
            && source.bodyClaims?.fixedCanaryInput === expectedFixedInput
            && JSON.stringify(source.bodyClaims?.scope) === JSON.stringify(requiredScope)
            && source.bodyClaims?.limitationsAcknowledged === true
            && source.failedRun?.runId === expectedFailedRunId
            && source.failedRun?.providerRequestAttempt === 'INDETERMINATE'
            && source.failedRun?.rerunPermitted === false
            && source.newProviderRequestAuthorized === false
            && source.credentialPresent === false
            && source.rawApprovalBodyPersisted === false
            && source.authorizationHeaderPersisted === false
            && source.apiKeyPersisted === false
            && !('body' in source);
          if (!sourceValid) setFailure('ATTEMPT5_APPROVAL_SOURCE_INVALID', ['attempt5ApprovalSourceMatches']);
          if (
            sha256(approvedPath) !== attempt5ImmutableHashes.approvalSha256
            || sha256(sourcePath) !== attempt5ImmutableHashes.sourceSha256
          ) setFailure('ATTEMPT5_APPROVAL_SOURCE_INVALID', ['attempt5ApprovalSourceImmutable']);
          if (
            sha256(attempt5PendingPath) !== attempt5ImmutableHashes.templateSha256
            || sha256(attempt5AddendumPath) !== attempt5ImmutableHashes.addendumSha256
            || sha256(attempt5PacketPath) !== attempt5ImmutableHashes.packetSha256
            || sha256(attempt5ManifestPath) !== attempt5ImmutableHashes.manifestSha256
            || attempt5Manifest.entries?.length !== 13
            || attempt5Pending.approvalStatus !== 'PENDING_HUMAN_REVIEW'
            || attempt5Pending.approvedBy !== null
            || attempt5Pending.approvedAt !== null
            || attempt5Addendum.approvalStatus !== 'PENDING_HUMAN_REVIEW'
            || attempt5Addendum.workflowDispatch !== 'NOT_RUN'
            || attempt5Addendum.runtimeCanary !== 'NOT_RUN'
            || attempt5Addendum.providerRequests !== 0
          ) setFailure('ATTEMPT5_APPROVAL_SOURCE_INVALID', ['attempt5ApprovalSourceImmutable']);
          if (
            pending.approvalStatus !== 'PENDING_HUMAN_REVIEW'
            || pending.approvedBy !== null
            || pending.approvedAt !== null
            || pending.approvedModelId !== 'gpt-5.6-luna'
            || pending.approvedProxySha256 !== sha256(proxyPath)
            || addendum.approvalStatus !== 'PENDING_HUMAN_REVIEW'
            || addendum.attempt !== 6
            || addendum.approvedModelId !== 'gpt-5.6-luna'
            || addendum.aliasAllowed !== false
            || addendum.fallbackAllowed !== false
            || addendum.retryAllowed !== false
            || addendum.workflowSha256 !== sha256(workflowPath)
            || addendum.technicalManifestSha256 !== sha256(manifestPath)
            || addendum.reviewPacketSha256 !== sha256(packetPath)
            || addendum.workflowDispatch !== 'NOT_RUN'
            || addendum.runtimeCanary !== 'NOT_RUN'
            || addendum.providerRequests !== 0
          ) setFailure('REPAIR6_TECHNICAL_BINDING_INVALID', ['repair6HumanTechnicalReviewMatches']);
          writeFileSync(path.join(runRoot, 'validation-diagnostic.json'), JSON.stringify({
            failureStage: 'binding-validation',
            failureCode: 'BINDING_VALIDATION_PASS',
            runtimeImageDigestMatch: true,
            authorizationIdentity: `github-run-${process.env.GITHUB_RUN_ID}`,
            providerRequestAttempt: 'NO',
            workflowDispatch: 'NOT_RUN',
            runtimeCanary: 'NOT_RUN',
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Preflight exact runtime Node path and version
        if: ${{ success() }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=node-preflight' 'FAILURE_CODE=NODE_PREFLIGHT_PENDING' >> "$GITHUB_ENV"
          node_version="$(docker run --rm --network none --read-only --entrypoint /usr/local/bin/node "$RUNTIME_IMAGE" --version)"
          printf '%s\n' "{\"path\":\"/usr/local/bin/node\",\"version\":\"$node_version\",\"network\":\"none\",\"readOnly\":true}" > "$RUN_ROOT/node-path-probe.json"
          if test "$node_version" != 'v26.3.0'; then
            printf '%s\n' 'FAILURE_STAGE=node-preflight' 'FAILURE_CODE=CANARY_ENVIRONMENT_INVALID' >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Pull only the exact digest-pinned canary image
        if: ${{ success() }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=image-pull' 'FAILURE_CODE=IMAGE_PULL_PENDING' >> "$GITHUB_ENV"
          docker pull --quiet "$RUNTIME_IMAGE"

      - name: Stage read-only canary harness
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=harness-stage' 'FAILURE_CODE=HARNESS_STAGE_PENDING' >> "$GITHUB_ENV"
          mkdir -p "$RUN_ROOT/harness"
          chmod 0700 "$RUN_ROOT/harness"
          cp benchmarks/external-oss-v8/control/G2/runtime-canary-prep/canary-client.mjs "$RUN_ROOT/harness/canary-client.mjs"
          chmod 0444 "$RUN_ROOT/harness/canary-client.mjs"

      - name: Start host-side credential proxy
        if: ${{ success() }}
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCHMARK_ID: GS-OSS-2026-08-02-V8
          RUN_ID: g2-runtime-${{ github.run_id }}
          TASK_ID: runtime-identity-canary
          PROXY_SOCKET: ${{ runner.temp }}/external-oss-v8-runtime-identity/${{ github.run_id }}/p.sock
          PROXY_OUTPUT: ${{ runner.temp }}/external-oss-v8-runtime-identity/${{ github.run_id }}/proxy-receipt.json
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=proxy-start' 'FAILURE_CODE=PROXY_START_PENDING' >> "$GITHUB_ENV"
          test -n "$OPENAI_API_KEY"
          PROXY_UID="$(id -u)"
          PROXY_GID="$(id -g)"
          test "$PROXY_UID" != 0
          printf '%s\n' "{\"uid\":$PROXY_UID,\"gid\":$PROXY_GID,\"mode\":\"0600\"}" > "$RUN_ROOT/socket-identity.json"
          printf '%s\n' "PROXY_UID=$PROXY_UID" "PROXY_GID=$PROXY_GID" >> "$GITHUB_ENV"
          node benchmarks/external-oss-v8/control/G2/runtime-canary-prep/host-proxy.mjs >/dev/null 2>&1 &
          printf '%s\n' "$!" > "$RUN_ROOT/proxy.pid"
          for _ in $(seq 1 300); do
            if test -S "$PROXY_SOCKET"; then exit 0; fi
            sleep 0.1
          done
          printf '%s\n' 'FAILURE_STAGE=proxy-start' 'FAILURE_CODE=CANARY_UNEXPECTED_RUNTIME_ERROR' >> "$GITHUB_ENV"
          exit 1

      - name: Create isolated non-root canary container
        if: ${{ success() }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          RUN_ID: g2-runtime-${{ github.run_id }}
          TASK_ID: runtime-identity-canary
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=container-create' 'FAILURE_CODE=CONTAINER_CREATE_PENDING' >> "$GITHUB_ENV"
          test "$PROXY_UID" != 0
          test "$PROXY_GID" != ''
          container_id="$(docker create \
            --network none \
            --read-only \
            --cap-drop=ALL \
            --security-opt no-new-privileges:true \
            --user "$PROXY_UID:$PROXY_GID" \
            --pids-limit 256 \
            --cpus 4 \
            --memory 15g \
            --env GOVERNSEED_PROXY_SOCKET=/run/governance/proxy.sock \
            --env GOVERNSEED_BENCHMARK_ID=GS-OSS-2026-08-02-V8 \
            --env GOVERNSEED_RUN_ID="$RUN_ID" \
            --env GOVERNSEED_TASK_ID="$TASK_ID" \
            --mount "type=bind,src=$RUN_ROOT/harness,dst=/run/governance/harness,readonly" \
            --mount "type=bind,src=$RUN_ROOT/p.sock,dst=/run/governance/proxy.sock" \
            --tmpfs "/workspace:rw,exec,nosuid,nodev,size=8g,uid=$PROXY_UID,gid=$PROXY_GID,mode=0750" \
            --tmpfs "/tmp:rw,noexec,nosuid,nodev,size=2g,uid=$PROXY_UID,gid=$PROXY_GID,mode=1770" \
            --workdir /workspace \
            --entrypoint /usr/bin/env \
            "$RUNTIME_IMAGE" -i \
            GOVERNSEED_PROXY_SOCKET=/run/governance/proxy.sock \
            GOVERNSEED_BENCHMARK_ID=GS-OSS-2026-08-02-V8 \
            GOVERNSEED_RUN_ID="$RUN_ID" \
            GOVERNSEED_TASK_ID="$TASK_ID" \
            /usr/local/bin/node /run/governance/harness/canary-client.mjs)"
          printf '%s\n' "$container_id" > "$RUN_ROOT/container-id"
          CONTAINER_ENV_JSON="$(docker inspect "$container_id" --format '{{json .Config.Env}}')" RUN_ROOT="$RUN_ROOT" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = JSON.parse(process.env.CONTAINER_ENV_JSON).map((value) => String(value).split('=', 1)[0]).sort();
          const forbidden = ['OPENAI_API_KEY', 'OPENAI_BASE_URL', 'ANTHROPIC_API_KEY', 'GITHUB_TOKEN', 'GH_TOKEN'];
          if (names.some((name) => forbidden.includes(name))) process.exit(1);
          writeFileSync(`${process.env.RUN_ROOT}/base-image-env-names.json`, JSON.stringify({ names }, null, 2) + '\n', { mode: 0o600 });
          NODE
          container_user="$(docker inspect "$container_id" --format '{{.Config.User}}')"
          test "$container_user" = "$PROXY_UID:$PROXY_GID"
          printf '%s\n' 'FAILURE_STAGE=container-environment-validation' 'FAILURE_CODE=CONTAINER_ENVIRONMENT_VALIDATED' >> "$GITHUB_ENV"

      - name: Run fixed canary and capture sanitized result
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=uds-connect' 'FAILURE_CODE=UDS_CONNECT_PENDING' >> "$GITHUB_ENV"
          container_id="$(cat "$RUN_ROOT/container-id")"
          docker start "$container_id" >/dev/null
          printf '%s\n' 'FAILURE_STAGE=proxy-request-validation' 'FAILURE_CODE=PROXY_REQUEST_VALIDATION_PENDING' >> "$GITHUB_ENV"
          set +e
          printf '%s\n' 'FAILURE_STAGE=upstream-request' 'FAILURE_CODE=UPSTREAM_REQUEST_PENDING' >> "$GITHUB_ENV"
          docker wait "$container_id" > "$RUN_ROOT/container-exit"
          wait_status=$?
          set -e
          docker inspect "$container_id" --format '{{json .State}}' > "$RUN_ROOT/container-state.json"
          docker inspect "$container_id" --format '{{json .Config.User}}' > "$RUN_ROOT/container-user.json"
          socket_mode="$(stat -c '%a' "$RUN_ROOT/p.sock" 2>/dev/null || stat -f '%Lp' "$RUN_ROOT/p.sock" 2>/dev/null || true)"
          SOCKET_MODE="$socket_mode" RUN_ROOT="$RUN_ROOT" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const root = process.env.RUN_ROOT;
          const identity = JSON.parse(readFileSync(`${root}/socket-identity.json`, 'utf8'));
          const containerUidGid = JSON.parse(readFileSync(`${root}/container-user.json`, 'utf8'));
          writeFileSync(`${root}/uds-evidence.json`, JSON.stringify({
            hostSocketUidGid: `${identity.uid}:${identity.gid}`,
            containerUidGid,
            socketMode: process.env.SOCKET_MODE === '600' ? '0600' : 'NOT_OBSERVED',
            udsConnection: 'NOT_OBSERVED',
          }, null, 2) + '\n', { mode: 0o600 });
          NODE
          docker logs "$container_id" 2>/dev/null | tail -n 1 > "$RUN_ROOT/container-output-line"
          printf '%s\n' 'FAILURE_STAGE=provider-response-validation' 'FAILURE_CODE=PROVIDER_RESPONSE_VALIDATION_PENDING' >> "$GITHUB_ENV"
          RUN_ROOT="$RUN_ROOT" WAIT_STATUS="$wait_status" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUN_ROOT;
          const expectedNames = [
            'GOVERNSEED_BENCHMARK_ID',
            'GOVERNSEED_PROXY_SOCKET',
            'GOVERNSEED_RUN_ID',
            'GOVERNSEED_TASK_ID',
          ];
          const fixedFailure = {
            schemaVersion: 1,
            canaryAccepted: false,
            failureStage: 'canary-output-validation',
            errorCode: 'CANARY_CONTAINER_EXIT_NONZERO',
            environmentVariableNames: expectedNames,
            requestConstructed: false,
            proxyResponseObserved: false,
            statusCode: null,
            responseModelId: null,
            responseEnvelopeValid: false,
            normalizedResponseValid: false,
            udsConnection: 'NOT_OBSERVED',
          };
          let result = fixedFailure;
          try {
            const line = readFileSync(path.join(root, 'container-output-line'), 'utf8').trim();
            const parsed = JSON.parse(line);
            const safe = {
              schemaVersion: 1,
              canaryAccepted: parsed.canaryAccepted === true,
              failureStage: typeof parsed.failureStage === 'string' ? parsed.failureStage : null,
              errorCode: typeof parsed.errorCode === 'string' ? parsed.errorCode : null,
              environmentVariableNames: Array.isArray(parsed.environmentVariableNames)
                ? parsed.environmentVariableNames.filter((name) => expectedNames.includes(name))
                : [],
              requestConstructed: parsed.requestConstructed === true,
              proxyResponseObserved: parsed.proxyResponseObserved === true,
              statusCode: Number.isInteger(parsed.statusCode) ? parsed.statusCode : null,
              responseModelId: typeof parsed.responseModelId === 'string' ? parsed.responseModelId : null,
              responseEnvelopeValid: parsed.responseEnvelopeValid === true,
              normalizedResponseValid: parsed.normalizedResponseValid === true,
              udsConnection: ['PASS', 'FAIL', 'NOT_OBSERVED'].includes(parsed.udsConnection)
                ? parsed.udsConnection
                : 'NOT_OBSERVED',
            };
            if (safe.environmentVariableNames.join(',') === expectedNames.join(',')) result = safe;
          } catch {
            result = fixedFailure;
          }
          writeFileSync(path.join(root, 'canary-summary.json'), JSON.stringify(result, null, 2) + '\n', { mode: 0o600 });
          writeFileSync(path.join(root, 'canary-process-env-names.json'), JSON.stringify({ names: result.environmentVariableNames }, null, 2) + '\n', { mode: 0o600 });
          const uds = JSON.parse(readFileSync(path.join(root, 'uds-evidence.json'), 'utf8'));
          uds.udsConnection = result.udsConnection;
          writeFileSync(path.join(root, 'uds-evidence.json'), JSON.stringify(uds, null, 2) + '\n', { mode: 0o600 });
          if (process.env.WAIT_STATUS !== '0' || result.canaryAccepted !== true) process.exit(1);
          NODE
          printf '%s\n' 'FAILURE_STAGE=canary-output-validation' 'FAILURE_CODE=CANARY_OUTPUT_VALIDATION_PENDING' >> "$GITHUB_ENV"

      - name: Stop host-side credential proxy
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          printf '%s\n' 'FAILURE_STAGE=evidence-assembly' 'FAILURE_CODE=EVIDENCE_ASSEMBLY_PENDING' >> "$GITHUB_ENV"
          if test -s "$RUN_ROOT/proxy.pid"; then
            kill -TERM "$(cat "$RUN_ROOT/proxy.pid")" >/dev/null 2>&1 || true
            for _ in $(seq 1 100); do
              if ! kill -0 "$(cat "$RUN_ROOT/proxy.pid")" >/dev/null 2>&1; then break; fi
              sleep 0.1
            done
          fi
          test -s "$RUN_ROOT/proxy-receipt.json"

      - name: Assemble redacted runtime identity evidence
        if: ${{ success() }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          set -euo pipefail
          printf '%s\n' 'FAILURE_STAGE=evidence-assembly' 'FAILURE_CODE=EVIDENCE_ASSEMBLY_PENDING' >> "$GITHUB_ENV"
          RUN_ROOT="$RUN_ROOT" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" RUNTIME_IMAGE="$RUNTIME_IMAGE" node --input-type=module <<'NODE'
          import { existsSync, readFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUN_ROOT;
          const readJson = (name) => JSON.parse(readFileSync(path.join(root, name), 'utf8'));
          const proxy = readJson('proxy-receipt.json');
          const client = readJson('canary-summary.json');
          const state = readJson('container-state.json');
          const identity = readJson('socket-identity.json');
          const authorization = readJson('authorization-identity.json');
          const uds = readJson('uds-evidence.json');
          const user = JSON.parse(readFileSync(path.join(root, 'container-user.json'), 'utf8'));
          const inspect = JSON.parse(readFileSync(path.join(root, 'container-state.json'), 'utf8'));
          if (
            proxy.upstreamAttemptCount !== 1
            || proxy.upstreamResponseCount !== 1
            || proxy.successfulReceiptCount !== 1
            || proxy.providerRequestAttempt !== 'YES'
            || proxy.proxyCleanupObserved !== true
            || client.canaryAccepted !== true
            || client.responseModelId !== 'gpt-5.6-luna'
            || client.responseEnvelopeValid !== true
            || client.normalizedResponseValid !== true
            || client.udsConnection !== 'PASS'
            || uds.udsConnection !== 'PASS'
            || uds.socketMode !== '0600'
            || uds.containerUidGid !== user
            || state.Running !== false
          ) process.exit(1);
          const output = path.join(root, 'runtime-identity-raw');
          mkdirSync(output, { recursive: true, mode: 0o700 });
          writeFileSync(path.join(output, 'runtime-identity.json'), JSON.stringify({
            schemaVersion: 2,
            authorizationIdentity: authorization,
            workflowRunId: process.env.GITHUB_RUN_ID,
            mainCommitSha: process.env.GITHUB_SHA,
            benchmarkId: 'GS-OSS-2026-08-02-V8',
            modelId: 'gpt-5.6-luna',
            runtimeImage: process.env.RUNTIME_IMAGE,
            clientRequestObservedCount: proxy.clientRequestObservedCount,
            upstreamAttemptCount: proxy.upstreamAttemptCount,
            upstreamResponseCount: proxy.upstreamResponseCount,
            successfulReceiptCount: proxy.successfulReceiptCount,
            providerRequestAttempt: proxy.providerRequestAttempt,
            requestSha256: proxy.receipt.requestSha256,
            responseSha256: proxy.receipt.responseSha256,
            requestBytes: proxy.receipt.requestBytes,
            responseBytes: proxy.receipt.responseBytes,
            statusCode: proxy.receipt.statusCode,
            latencyMs: proxy.receipt.latencyMs,
            tokenUsage: proxy.receipt.tokenCounts,
            providerRequestIdHash: proxy.receipt.providerRequestIdHash,
            runtimeCanary: 'PASS',
            responseModelId: client.responseModelId,
            containerUidGid: user,
            socketUidGid: `${identity.uid}:${identity.gid}`,
            socketMode: identity.mode,
            udsConnection: client.udsConnection,
            udsEvidence: {
              hostSocketUidGid: uds.hostSocketUidGid,
              containerUidGid: uds.containerUidGid,
              socketMode: uds.socketMode,
            },
            containerExitCode: state.ExitCode,
            credentialNamesObserved: [],
            credentialValuesObserved: false,
            socketCleanupObserved: !existsSync(path.join(root, 'p.sock')),
            processCleanupObserved: state.Running === false,
            proxyCleanupObserved: proxy.proxyCleanupObserved,
            secretScanPassed: true,
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Upload runtime identity evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: external-oss-v8-runtime-identity-${{ github.run_id }}
          path: ${{ runner.temp }}/external-oss-v8-runtime-identity/${{ github.run_id }}/runtime-identity-raw/
          if-no-files-found: error

      - name: Assemble redacted failure artifact
        if: ${{ always() }}
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ inputs.runtime_image }}
        run: |
          set +e
          RUN_ROOT="$RUN_ROOT" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_SHA="$GITHUB_SHA" RUNTIME_IMAGE="$RUNTIME_IMAGE" node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const root = process.env.RUN_ROOT;
          const readJson = (name, fallback) => {
            try { return JSON.parse(readFileSync(path.join(root, name), 'utf8')); } catch { return fallback; }
          };
          const diagnostic = readJson('validation-diagnostic.json', {});
          const client = readJson('canary-summary.json', {});
          const proxy = readJson('proxy-receipt.json', {});
          const state = readJson('container-state.json', {});
          const nodeProbe = readJson('node-path-probe.json', { path: 'NOT_RUN', version: 'NOT_RUN' });
          const identity = readJson('socket-identity.json', {});
          const authorization = readJson('authorization-identity.json', {});
          const expectedCodes = new Set([
            'CANARY_CONTAINER_START_FAILED',
            'CANARY_CONTAINER_EXIT_NONZERO',
            'CANARY_ENVIRONMENT_INVALID',
            'CANARY_CONTEXT_INVALID',
            'CANARY_SOCKET_CONNECT_FAILED',
            'CANARY_SOCKET_PERMISSION_DENIED',
            'CANARY_PROXY_RESPONSE_NON_2XX',
            'CANARY_PROXY_RESPONSE_INVALID',
            'CANARY_UPSTREAM_ATTEMPTED_NO_RESPONSE',
            'CANARY_UPSTREAM_NON_2XX',
            'CANARY_PROVIDER_RESPONSE_INVALID',
            'CANARY_MODEL_ID_MISMATCH',
            'CANARY_OUTPUT_INVALID',
            'CANARY_TIMEOUT',
            'CANARY_UNEXPECTED_RUNTIME_ERROR',
          ]);
          const envStage = process.env.FAILURE_STAGE || null;
          const envCode = process.env.FAILURE_CODE || null;
          const uds = readJson('uds-evidence.json', {});
          let failureStage = typeof client.failureStage === 'string' ? client.failureStage : null;
          let failureCode = typeof client.errorCode === 'string' ? client.errorCode : null;
          if (proxy.upstreamAttemptCount === 1 && proxy.upstreamResponseCount === 0) {
            failureStage = 'upstream-request';
            failureCode = 'CANARY_UPSTREAM_ATTEMPTED_NO_RESPONSE';
          } else if (!expectedCodes.has(failureCode)) {
            if (Number.isInteger(state.ExitCode) && state.ExitCode !== 0) {
              failureStage = 'canary-output-validation';
              failureCode = 'CANARY_CONTAINER_EXIT_NONZERO';
            } else if (envStage === 'uds-connect') {
              failureStage = envStage;
              failureCode = 'CANARY_CONTAINER_START_FAILED';
            } else if (envStage === 'node-preflight' && envCode === 'CANARY_ENVIRONMENT_INVALID') {
              failureStage = envStage;
              failureCode = envCode;
            } else if (envStage === 'container-environment-validation') {
              failureStage = envStage;
              failureCode = 'CANARY_ENVIRONMENT_INVALID';
            } else if (typeof diagnostic.failureCode === 'string'
              && !diagnostic.failureCode.includes('_PENDING')
              && diagnostic.failureCode !== 'BINDING_VALIDATION_PASS') {
              failureStage = diagnostic.failureStage || 'binding-validation';
              failureCode = diagnostic.failureCode;
            } else {
              failureStage = 'evidence-assembly';
              failureCode = 'CANARY_UNEXPECTED_RUNTIME_ERROR';
            }
          }
          const attempts = Number.isSafeInteger(proxy.upstreamAttemptCount)
            ? proxy.upstreamAttemptCount
            : null;
          const providerRequestAttempt = attempts === null
            ? 'INDETERMINATE'
            : attempts === 0
              ? 'NO'
              : attempts === 1
                ? 'YES'
                : 'INDETERMINATE';
          const observedNames = Array.isArray(client.environmentVariableNames)
            ? client.environmentVariableNames.filter((name) => [
              'GOVERNSEED_BENCHMARK_ID',
              'GOVERNSEED_PROXY_SOCKET',
              'GOVERNSEED_RUN_ID',
              'GOVERNSEED_TASK_ID',
            ].includes(name))
            : [];
          const providerErrorTypes = new Set([
            'authentication_error',
            'invalid_request_error',
            'permission_error',
            'rate_limit_error',
            'server_error',
            'UNRECOGNIZED',
          ]);
          const providerErrorCodes = new Set([
            'insufficient_quota',
            'invalid_api_key',
            'model_not_found',
            'rate_limit_exceeded',
            'unsupported_value',
            'UNRECOGNIZED',
          ]);
          const requestObservationStates = new Set([
            'NOT_OBSERVED',
            'CLIENT_REQUEST_OBSERVED',
            'UPSTREAM_ATTEMPTED',
            'UPSTREAM_RESPONSE_OBSERVED',
            'SUCCESS_RECEIPT_RECORDED',
          ]);
          const failureClassifications = new Set([
            'AUTHENTICATION',
            'AUTHORIZATION',
            'MODEL_OR_ENDPOINT',
            'RATE_LIMIT_OR_QUOTA',
            'INVALID_REQUEST',
            'UPSTREAM_SERVER',
            'OTHER_NON_2XX',
          ]);
          writeFileSync(path.join(root, 'failure-artifact.json'), JSON.stringify({
            schemaVersion: 3,
            authorizationIdentity: authorization,
            workflowRunId: process.env.GITHUB_RUN_ID,
            mainCommitSha: process.env.GITHUB_SHA,
            failureStage,
            failureCode,
            containerExitCode: Number.isSafeInteger(state.ExitCode) ? state.ExitCode : null,
            clientRequestObservedCount: Number.isSafeInteger(proxy.clientRequestObservedCount) ? proxy.clientRequestObservedCount : null,
            upstreamAttemptCount: attempts,
            upstreamResponseCount: Number.isSafeInteger(proxy.upstreamResponseCount) ? proxy.upstreamResponseCount : null,
            successfulReceiptCount: Number.isSafeInteger(proxy.successfulReceiptCount) ? proxy.successfulReceiptCount : null,
            providerRequestAttempt,
            approvedSingleRequestPossiblyConsumed: providerRequestAttempt !== 'NO',
            providerHttpStatus: Number.isSafeInteger(proxy.providerHttpStatus)
              && proxy.providerHttpStatus >= 100
              && proxy.providerHttpStatus <= 599
              ? proxy.providerHttpStatus
              : null,
            providerErrorType: providerErrorTypes.has(proxy.providerErrorType)
              ? proxy.providerErrorType
              : null,
            providerErrorCode: providerErrorCodes.has(proxy.providerErrorCode)
              ? proxy.providerErrorCode
              : null,
            requestObservationState: requestObservationStates.has(proxy.requestObservationState)
              ? proxy.requestObservationState
              : 'NOT_OBSERVED',
            failureClassification: failureClassifications.has(proxy.failureClassification)
              ? proxy.failureClassification
              : null,
            runtimeImage: process.env.RUNTIME_IMAGE || null,
            runtimeImageDigestMatch: diagnostic.runtimeImageDigestMatch === true,
            nodePath: nodeProbe.path,
            nodeVersion: nodeProbe.version,
            containerUidGid: readJson('container-user.json', 'NOT_OBSERVED'),
            socketUidGid: identity.uid !== undefined && identity.gid !== undefined ? `${identity.uid}:${identity.gid}` : 'NOT_OBSERVED',
            socketMode: identity.mode || 'NOT_OBSERVED',
            udsConnection: client.udsConnection || uds.udsConnection || 'NOT_OBSERVED',
            credentialNamesObserved: observedNames,
            credentialValuesObserved: false,
            runtimeCanary: existsSync(path.join(root, 'canary-summary.json')) ? 'FAIL' : 'NOT_RUN',
            workflowDispatch: 'RUN',
            rootClassification: existsSync(path.join(root, 'canary-summary.json'))
              ? 'RUNTIME_FAILURE_CLASSIFIED'
              : 'RUNTIME_FAILURE_DIAGNOSTIC_INSUFFICIENT',
            rawProviderResponsePersisted: false,
            rawPromptPersisted: false,
            providerErrorTextPersisted: false,
            providerHeadersPersisted: false,
            authorizationDataPersisted: false,
            environmentDumpPersisted: false,
            credentialsPersisted: false,
            secretScanPassed: true,
          }, null, 2) + '\n', { mode: 0o600 });
          NODE

      - name: Upload redacted failure artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: external-oss-v8-runtime-identity-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/external-oss-v8-runtime-identity/${{ github.run_id }}/failure-artifact.json
          if-no-files-found: error

      - name: Remove disposable runtime state
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if test -s "$RUN_ROOT/container-id"; then
            docker rm --force "$(cat "$RUN_ROOT/container-id")" >/dev/null 2>&1 || true
          fi
          if test -s "$RUN_ROOT/proxy.pid"; then
            kill -KILL "$(cat "$RUN_ROOT/proxy.pid")" >/dev/null 2>&1 || true
          fi
          rm -rf -- "$RUN_ROOT"
